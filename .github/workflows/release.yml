name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Build target to run (all runs the standard release matrix)"
        type: choice
        default: "all"
        options:
          - all
          - tarball
          - deb
          - deb-ubuntu24.04
          - deb-debian12
          - deb-debian11
          - fedora
          - opensuse
          - arch
          - flatpak
      arch:
        description: "Architecture filter for tarball/deb (all, amd64, arm64)"
        type: choice
        default: "all"
        options:
          - all
          - amd64
          - arm64
      mode:
        description: "Variant filter for tarball/deb (all, full, lite)"
        type: choice
        default: "all"
        options:
          - all
          - full
          - lite

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}', inputs.target, inputs.arch, inputs.mode) || 'release' }}
  cancel-in-progress: true

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G

jobs:
  source_archive:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.meta.outputs.package_version }}
      package_release: ${{ steps.meta.outputs.package_release }}
      source_archive: ${{ steps.meta.outputs.source_archive }}
      run_tarball: ${{ steps.matrix.outputs.run_tarball }}
      tarball_matrix: ${{ steps.matrix.outputs.tarball_matrix }}
      run_deb: ${{ steps.matrix.outputs.run_deb }}
      deb_matrix: ${{ steps.matrix.outputs.deb_matrix }}
    steps:
      - uses: actions/checkout@v6

      - id: matrix
        shell: python3 {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target || 'all' }}
          INPUT_ARCH: ${{ inputs.arch || 'all' }}
          INPUT_MODE: ${{ inputs.mode || 'all' }}
        run: |
          import json
          import os

          is_dispatch = os.environ["EVENT_NAME"] == "workflow_dispatch"
          target = os.environ["INPUT_TARGET"] if is_dispatch else "all"
          arch_filter = os.environ["INPUT_ARCH"] if is_dispatch else "all"
          mode_filter = os.environ["INPUT_MODE"] if is_dispatch else "all"

          arch_to_tarball = {"amd64": "x86_64", "arm64": "aarch64"}
          mode_to_tarball = {"full": "bundled", "lite": "lite"}

          tarball_rows = [
              {"arch": "x86_64", "runner": "ubuntu-24.04", "mode": "bundled", "enable_local_asr": "ON"},
              {"arch": "x86_64", "runner": "ubuntu-24.04", "mode": "lite", "enable_local_asr": "OFF"},
              {"arch": "aarch64", "runner": "ubuntu-24.04-arm", "mode": "bundled", "enable_local_asr": "ON"},
              {"arch": "aarch64", "runner": "ubuntu-24.04-arm", "mode": "lite", "enable_local_asr": "OFF"},
          ]
          if target in ("all", "tarball"):
              tarball_selected = [
                  row for row in tarball_rows
                  if (arch_filter == "all" or row["arch"] == arch_to_tarball[arch_filter])
                  and (mode_filter == "all" or row["mode"] == mode_to_tarball[mode_filter])
              ]
          else:
              tarball_selected = []

          deb_distros = [
              ("ubuntu24.04", "ubuntu:24.04"),
              ("debian12", "debian:12"),
              ("debian11", "debian:11"),
          ]

          deb_rows = []
          for distro, image in deb_distros:
              for arch, runner in (("amd64", "ubuntu-latest"), ("arm64", "ubuntu-24.04-arm")):
                  for mode, local_asr in (("full", "ON"), ("lite", "OFF")):
                      deb_rows.append({
                          "distro": distro,
                          "image": image,
                          "arch": arch,
                          "runner": runner,
                          "mode": mode,
                          "enable_local_asr": local_asr,
                      })

          if target in ("all", "deb") or target.startswith("deb-"):
              distro_filter = target.removeprefix("deb-") if target.startswith("deb-") else None
              deb_selected = [
                  row for row in deb_rows
                  if (distro_filter is None or row["distro"] == distro_filter)
                  and (arch_filter == "all" or row["arch"] == arch_filter)
                  and (mode_filter == "all" or row["mode"] == mode_filter)
              ]
          else:
              deb_selected = []

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run_tarball={'true' if tarball_selected else 'false'}\n")
              out.write(f"tarball_matrix={json.dumps({'include': tarball_selected}, separators=(',', ':'))}\n")
              out.write(f"run_deb={'true' if deb_selected else 'false'}\n")
              out.write(f"deb_matrix={json.dumps({'include': deb_selected}, separators=(',', ':'))}\n")

      - id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ -z "${version}" || "${version}" == "${tag}" ]]; then
            version="$(tr -d '\n' < VERSION)"
          fi

          {
            echo "package_version=${version}"
            echo "package_release=1"
            echo "source_archive=fcitx5-vinput-${version}.tar.gz"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify VERSION matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${{ steps.meta.outputs.package_version }}"
          version_file="$(tr -d '\n' < VERSION)"
          if [[ "${version_file}" != "${version}" ]]; then
            echo "VERSION file is ${version_file}, but release tag is ${version}" >&2
            exit 1
          fi

      - name: Create source archive
        shell: bash
        run: |
          mkdir -p dist
          ./scripts/create-source-archive.sh \
            "dist/${{ steps.meta.outputs.source_archive }}" \
            "${{ steps.meta.outputs.package_version }}" \
            "${GITHUB_WORKSPACE}"

      - uses: actions/upload-artifact@v6
        with:
          name: source-archive
          path: dist/${{ steps.meta.outputs.source_archive }}
          if-no-files-found: error

  build-linux-tarball:
    needs: source_archive
    if: needs.source_archive.outputs.run_tarball == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.source_archive.outputs.tarball_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh ubuntu24.04

      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: dist

      - name: Unpack source archive
        run: |
          tar -xf "dist/${{ needs.source_archive.outputs.source_archive }}"

      - name: Install sherpa-onnx build runtime
        if: matrix.enable_local_asr == 'ON'
        run: |
          prefix="${RUNNER_TEMP}/sherpa-onnx-install"
          source "fcitx5-vinput-${{ needs.source_archive.outputs.package_version }}/scripts/sherpa-onnx-vars.sh"
          bash "fcitx5-vinput-${{ needs.source_archive.outputs.package_version }}/scripts/build-sherpa-onnx.sh" \
            "${SHERPA_ONNX_VERSION}" "${prefix}"
          echo "VINPUT_CMAKE_PREFIX_PATH=${prefix}" >> "${GITHUB_ENV}"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-release-tarball-${{ matrix.arch }}-${{ matrix.mode }}-${{ github.ref_name }}
          restore-keys: |
            sccache-release-tarball-${{ matrix.arch }}-${{ matrix.mode }}-

      - name: Configure
        run: |
          cd "fcitx5-vinput-${{ needs.source_archive.outputs.package_version }}"
          cmake --preset ci-clang-mold \
            -DVINPUT_ENABLE_LOCAL_ASR=${{ matrix.enable_local_asr }} \
            -DVINPUT_PROJECT_VERSION="${{ needs.source_archive.outputs.package_version }}" \
            -DVINPUT_PACKAGE_RELEASE="${{ needs.source_archive.outputs.package_release }}" \
            -DVINPUT_PACKAGE_HOMEPAGE_URL="${{ github.server_url }}/${{ github.repository }}" \
            -DVINPUT_RUNTIME_MODE=bundled

      - name: Build
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --start-server 2>/dev/null || true
          fi
          cd "fcitx5-vinput-${{ needs.source_archive.outputs.package_version }}"
          cmake --build --preset ci-clang-mold

      - name: Package tarball
        shell: bash
        run: |
          version="${{ needs.source_archive.outputs.package_version }}"
          release="${{ needs.source_archive.outputs.package_release }}"
          mode="${{ matrix.mode }}"
          stage_root="${RUNNER_TEMP}/stage"
          archive_root="fcitx5-vinput_${version}-${release}_linux_${{ matrix.arch }}_${mode}"
          build_root="${GITHUB_WORKSPACE}/fcitx5-vinput-${version}/build"

          rm -rf "${stage_root}" dist/release
          mkdir -p "${stage_root}" dist/release
          DESTDIR="${stage_root}" cmake --install "${build_root}"
          mv "${stage_root}/usr" "dist/release/${archive_root}"
          tar -C dist/release -czf "dist/${archive_root}.tar.gz" "${archive_root}"

      - uses: actions/upload-artifact@v6
        with:
          name: release-tarball-${{ matrix.mode }}-${{ matrix.arch }}
          path: dist/fcitx5-vinput_*_linux_${{ matrix.arch }}_${{ matrix.mode }}.tar.gz
          if-no-files-found: error

  build-deb:
    needs: source_archive
    if: needs.source_archive.outputs.run_deb == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.source_archive.outputs.deb_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh ${{ matrix.distro }}

      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: dist

      - name: Unpack source archive
        run: |
          tar -xf "dist/${{ needs.source_archive.outputs.source_archive }}"

      - name: Prepare distro-native runtime prefix
        if: matrix.enable_local_asr == 'ON'
        run: |
          prefix="${GITHUB_WORKSPACE}/runtime"
          bash "fcitx5-vinput-${{ needs.source_archive.outputs.package_version }}/scripts/build-sherpa-onnx.sh" \
            "" "${prefix}"

      - uses: actions/cache@v6
        if: matrix.distro != 'debian11'
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-release-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.mode }}-${{ github.ref_name }}
          restore-keys: |
            sccache-release-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.mode }}-

      - name: Build Debian package
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --start-server 2>/dev/null || true
          fi
          cd "fcitx5-vinput-${{ needs.source_archive.outputs.package_version }}"
          prefix_args=()
          if [[ "${{ matrix.enable_local_asr }}" == "ON" ]]; then
            prefix_args+=(-DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/runtime")
          fi
          if [[ "${{ matrix.distro }}" == "debian11" ]]; then
            CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld \
              -DVINPUT_ENABLE_LOCAL_ASR=${{ matrix.enable_local_asr }} \
              "${prefix_args[@]}" \
              -DVINPUT_PROJECT_VERSION="${{ needs.source_archive.outputs.package_version }}" \
              -DVINPUT_PACKAGE_RELEASE="${{ needs.source_archive.outputs.package_release }}" \
              -DVINPUT_PACKAGE_CONTACT="${{ github.repository_owner }} <noreply@github.com>" \
              -DVINPUT_PACKAGE_HOMEPAGE_URL="${{ github.server_url }}/${{ github.repository }}"
            cmake --build build
          else
            cmake --preset ci-clang-mold \
              -DVINPUT_ENABLE_LOCAL_ASR=${{ matrix.enable_local_asr }} \
              "${prefix_args[@]}" \
              -DVINPUT_PROJECT_VERSION="${{ needs.source_archive.outputs.package_version }}" \
              -DVINPUT_PACKAGE_RELEASE="${{ needs.source_archive.outputs.package_release }}" \
              -DVINPUT_PACKAGE_CONTACT="${{ github.repository_owner }} <noreply@github.com>" \
              -DVINPUT_PACKAGE_HOMEPAGE_URL="${{ github.server_url }}/${{ github.repository }}"
            cmake --build --preset ci-clang-mold
          fi
          cpack --config build/CPackConfig.cmake -G DEB -B "${GITHUB_WORKSPACE}/dist"

          if [[ "${{ matrix.enable_local_asr }}" == "ON" ]]; then
            mv \
              "${GITHUB_WORKSPACE}/dist/fcitx5-vinput_${{ needs.source_archive.outputs.package_version }}-1_${{ matrix.arch }}.deb" \
              "${GITHUB_WORKSPACE}/dist/fcitx5-vinput_${{ needs.source_archive.outputs.package_version }}-1_${{ matrix.distro }}_${{ matrix.arch }}.deb"
          else
            mv \
              "${GITHUB_WORKSPACE}/dist/fcitx5-vinput-lite_${{ needs.source_archive.outputs.package_version }}-1_${{ matrix.arch }}.deb" \
              "${GITHUB_WORKSPACE}/dist/fcitx5-vinput-lite_${{ needs.source_archive.outputs.package_version }}-1_${{ matrix.distro }}_${{ matrix.arch }}.deb"
          fi

      - name: Verify Debian package ABI & dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.enable_local_asr }}" == "ON" ]]; then
            deb_file="${GITHUB_WORKSPACE}/dist/fcitx5-vinput_${{ needs.source_archive.outputs.package_version }}-1_${{ matrix.distro }}_${{ matrix.arch }}.deb"
          else
            deb_file="${GITHUB_WORKSPACE}/dist/fcitx5-vinput-lite_${{ needs.source_archive.outputs.package_version }}-1_${{ matrix.distro }}_${{ matrix.arch }}.deb"
          fi
          abi_args=(
            --require-bin vinput-gui
            --require-bin vinput-daemon
            --require-bin vinput
            --require-file 'usr/share/fcitx5-vinput/translations/zh_CN.qm'
            --forbid-needed 'libssl.so.*'
            --forbid-needed 'libcrypto.so.*'
            --forbid-needed 'libpipewire-0.3.so.*'
          )
          if [[ "${{ matrix.distro }}" == "debian11" ]]; then
            abi_args+=(
              --max-glibc 2.31
              --max-glibcxx 3.4.28
              --forbid-needed 'libQt6*'
            )
          fi
          python3 scripts/check-deb-abi.py "${deb_file}" "${abi_args[@]}"

      - uses: actions/upload-artifact@v6
        with:
          name: release-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.mode }}
          path: dist/*.deb
          if-no-files-found: error

  build-rpm-fedora:
    needs: source_archive
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'fedora'
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          ./scripts/ci-install-build-deps.sh fedora43
          dnf install -y rpm-build

      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: dist

      - name: Build RPM package
        shell: bash
        run: |
          version="${{ needs.source_archive.outputs.package_version }}"
          source ./scripts/sherpa-onnx-vars.sh
          mkdir -p "${HOME}/rpmbuild/"{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "dist/${{ needs.source_archive.outputs.source_archive }}" "${HOME}/rpmbuild/SOURCES/"
          curl -fL --retry 3 --retry-delay 2 \
            -o "${HOME}/rpmbuild/SOURCES/${SHERPA_ONNX_ARCHIVE}" \
            "${SHERPA_ONNX_URL}"

          sed \
            -e "s/@VINPUT_VERSION@/${version}/g" \
            -e "s/@SHERPA_ONNX_VERSION@/${SHERPA_ONNX_VERSION}/g" \
            packaging/fedora/fcitx5-vinput.spec \
            > "${HOME}/rpmbuild/SPECS/fcitx5-vinput.spec"

          # Build Full RPM
          rpmbuild -bb "${HOME}/rpmbuild/SPECS/fcitx5-vinput.spec" \
            --define "_topdir $HOME/rpmbuild"

          mkdir -p dist/full
          find "${HOME}/rpmbuild/RPMS" -name 'fcitx5-vinput-[0-9]*.rpm' -exec cp {} dist/full/ \;
          rm -rf "${HOME}/rpmbuild/RPMS"/*

          # Build Lite RPM
          rpmbuild -bb --without local_asr "${HOME}/rpmbuild/SPECS/fcitx5-vinput.spec" \
            --define "_topdir $HOME/rpmbuild"

          mkdir -p dist/lite
          find "${HOME}/rpmbuild/RPMS" -name 'fcitx5-vinput-lite-[0-9]*.rpm' -exec cp {} dist/lite/ \;

      - uses: actions/upload-artifact@v6
        with:
          name: release-rpm-fedora43-full
          path: dist/full/*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: release-rpm-fedora43-lite
          path: dist/lite/*.rpm
          if-no-files-found: error

  build-rpm-opensuse-leap:
    needs: source_archive
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'opensuse'
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/leap:15.6
    steps:
      - name: Install checkout prerequisites
        run: |
          zypper --gpg-auto-import-keys --non-interactive refresh
          zypper --non-interactive install --no-recommends gzip tar

      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh opensuse-leap

      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: dist

      - name: Build RPM package
        shell: bash
        run: |
          version="${{ needs.source_archive.outputs.package_version }}"
          source ./scripts/sherpa-onnx-vars.sh
          mkdir -p "${HOME}/rpmbuild/"{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "dist/${{ needs.source_archive.outputs.source_archive }}" "${HOME}/rpmbuild/SOURCES/"
          curl -fL --retry 3 --retry-delay 2 \
            -o "${HOME}/rpmbuild/SOURCES/${SHERPA_ONNX_ARCHIVE}" \
            "${SHERPA_ONNX_URL}"

          sed \
            -e "s/@VINPUT_VERSION@/${version}/g" \
            -e "s/@SHERPA_ONNX_VERSION@/${SHERPA_ONNX_VERSION}/g" \
            packaging/opensuse/fcitx5-vinput.spec \
            > "${HOME}/rpmbuild/SPECS/fcitx5-vinput.spec"

          # Build Full RPM
          rpmbuild -bb "${HOME}/rpmbuild/SPECS/fcitx5-vinput.spec" \
            --define "_topdir $HOME/rpmbuild"

          mkdir -p dist/full
          find "${HOME}/rpmbuild/RPMS" -name 'fcitx5-vinput-[0-9]*.rpm' -exec cp {} dist/full/ \;
          rm -rf "${HOME}/rpmbuild/RPMS"/*

          # Build Lite RPM
          rpmbuild -bb --without local_asr "${HOME}/rpmbuild/SPECS/fcitx5-vinput.spec" \
            --define "_topdir $HOME/rpmbuild"

          mkdir -p dist/lite
          find "${HOME}/rpmbuild/RPMS" -name 'fcitx5-vinput-lite-[0-9]*.rpm' -exec cp {} dist/lite/ \;

      - uses: actions/upload-artifact@v6
        with:
          name: release-rpm-opensuse-leap15.6-full
          path: dist/full/*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: release-rpm-opensuse-leap15.6-lite
          path: dist/lite/*.rpm
          if-no-files-found: error

  build-arch:
    needs: source_archive
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'arch'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh archlinux

      - uses: actions/download-artifact@v8
        with:
          name: source-archive
          path: dist

      - name: Render PKGBUILDs
        shell: bash
        run: |
          cp "dist/${{ needs.source_archive.outputs.source_archive }}" packaging/arch/
          mkdir -p packaging/arch-lite
          cp "dist/${{ needs.source_archive.outputs.source_archive }}" packaging/arch-lite/

          VINPUT_PKGURL="${{ github.server_url }}/${{ github.repository }}" \
            ./scripts/render-arch-pkgbuild.sh \
            packaging/arch/PKGBUILD.in \
            packaging/arch/PKGBUILD \
            "${{ needs.source_archive.outputs.package_version }}" \
            "packaging/arch/${{ needs.source_archive.outputs.source_archive }}" \
            "${{ needs.source_archive.outputs.package_release }}"

          VINPUT_PKGURL="${{ github.server_url }}/${{ github.repository }}" \
            ./scripts/render-arch-pkgbuild.sh \
            packaging/arch/PKGBUILD.lite.in \
            packaging/arch-lite/PKGBUILD \
            "${{ needs.source_archive.outputs.package_version }}" \
            "packaging/arch-lite/${{ needs.source_archive.outputs.source_archive }}" \
            "${{ needs.source_archive.outputs.package_release }}"

      - name: Build Arch packages
        shell: bash
        run: |
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          su builder -c "cd '${GITHUB_WORKSPACE}/packaging/arch' && makepkg --noconfirm --cleanbuild --force"
          su builder -c "cd '${GITHUB_WORKSPACE}/packaging/arch-lite' && makepkg --noconfirm --cleanbuild --force"

      - uses: actions/upload-artifact@v6
        with:
          name: release-arch-full
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: release-arch-lite
          path: packaging/arch-lite/*.pkg.tar.zst
          if-no-files-found: error

  build-flatpak:
    needs: source_archive
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'flatpak'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Render pinned Flatpak manifests
        shell: bash
        run: |
          cp packaging/flatpak/org.fcitx.Fcitx5.Addon.Vinput.yaml \
            packaging/flatpak/release-manifest.yaml
          sed -i \
            -e "s|@FCITX5_RUNTIME_VERSION@|stable|g" \
            -e "s|@VINPUT_RELEASE_TAG@|${GITHUB_REF_NAME}|g" \
            -e "s|@VINPUT_RELEASE_COMMIT@|${GITHUB_SHA}|g" \
            packaging/flatpak/release-manifest.yaml

          cp packaging/flatpak/org.fcitx.Fcitx5.Addon.Vinput.lite.yaml \
            packaging/flatpak/release-manifest-lite.yaml
          sed -i \
            -e "s|@FCITX5_RUNTIME_VERSION@|stable|g" \
            -e "s|@VINPUT_RELEASE_TAG@|${GITHUB_REF_NAME}|g" \
            -e "s|@VINPUT_RELEASE_COMMIT@|${GITHUB_SHA}|g" \
            packaging/flatpak/release-manifest-lite.yaml

          # Branch dispatches (workflow_dispatch) render tag=main, a moving
          # pointer: flatpak-builder re-resolves the branch at build time and
          # fails if main advanced since dispatch. Drop `tag:` so the module
          # pins only the commit, which is checked out directly without any
          # branch resolution. Tag pushes keep tag+commit (both immutable).
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            sed -i -e '/^[[:space:]]*tag:/d' packaging/flatpak/release-manifest.yaml
            sed -i -e '/^[[:space:]]*tag:/d' packaging/flatpak/release-manifest-lite.yaml
          fi

          grep -nE 'tag:|commit:' packaging/flatpak/release-manifest.yaml \
            packaging/flatpak/release-manifest-lite.yaml

      - name: Build Full Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/release-manifest.yaml
          bundle: fcitx5-vinput.flatpak
          repository-name: flathub
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Build Lite Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/release-manifest-lite.yaml
          bundle: fcitx5-vinput-lite.flatpak
          repository-name: flathub
          cache-key: flatpak-builder-lite-${{ github.sha }}

  publish-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.target == 'all' && inputs.arch == 'all' && inputs.mode == 'all'))
    needs:
      - source_archive
      - build-linux-tarball
      - build-deb
      - build-rpm-fedora
      - build-rpm-opensuse-leap
      - build-arch
      - build-flatpak
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          args: --latest --strip header

      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish assets to GitHub Release
        shell: bash
        run: |
          mkdir -p release
          find release-artifacts -type f -exec cp {} release/ \;

          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GH_REPO}" \
              --notes "${{ steps.changelog.outputs.content }}"
          fi

          gh release upload "${GITHUB_REF_NAME}" --repo "${GH_REPO}" release/* --clobber
