name: audit

on:
  schedule:
    # Daily full-repository audit at 04:00 CST (20:00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G

jobs:
  clang-tidy-audit:
    name: Full Clang-Tidy Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Restore apt archive cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vinput-apt-archives
          key: apt-archives-${{ runner.os }}-${{ hashFiles('scripts/ci-install-build-deps.sh') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh ubuntu24.04

      - name: Install LLVM 21 clang-tools
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21 clang-tidy-21

      - name: Install sherpa-onnx runtime
        run: |
          prefix="${RUNNER_TEMP}/sherpa-onnx-install"
          source scripts/sherpa-onnx-vars.sh
          bash scripts/build-sherpa-onnx.sh "${SHERPA_ONNX_VERSION}" "${prefix}"
          echo "VINPUT_CMAKE_PREFIX_PATH=${prefix}" >> "${GITHUB_ENV}"

      - name: Configure CMake
        run: |
          cmake --preset release-clang-mold \
            -DVINPUT_ENABLE_WERROR=ON \
            -DVINPUT_PACKAGE_HOMEPAGE_URL="${{ github.server_url }}/${{ github.repository }}" \
            -DVINPUT_RUNTIME_MODE=bundled

      - name: Run Full Clang-Tidy & Format Audit
        run: ./scripts/ci-run-linter.sh --mode=full --report-dir=audit-report

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-clang-tidy-audit-report
          path: audit-report/
          retention-days: 7
