name: cpp-linter

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cpp-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-linter:
    name: cpp-linter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run cpp-linter (PR Review & Formatting)
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'
          tidy-checks: '-*'
          version: '18'
          lines-changed-only: true
          files-changed-only: true
          step-summary: true
          file-annotations: true
          thread-comments: 'update'

      - name: Fail on formatting violations
        if: steps.linter.outputs.clang-format-checks-failed > 0
        run: |
          echo "clang-format checks failed! Please run 'mise run fmt' locally."
          exit 1
