name: ci

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '3rdparty/**'
      - 'po/**'
      - 'i18n/**'
      - 'data/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'VERSION'
      - 'flake.nix'
      - 'flake.lock'
      - '.clang-format'
      - '.clang-tidy'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - '3rdparty/**'
      - 'po/**'
      - 'i18n/**'
      - 'data/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'VERSION'
      - 'flake.nix'
      - 'flake.lock'
      - '.clang-format'
      - '.clang-tidy'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G

jobs:
  cpp-linter:
    name: cpp-linter
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh ubuntu24.04

      - name: Install sherpa-onnx runtime
        run: |
          prefix="${RUNNER_TEMP}/sherpa-onnx-install"
          source scripts/sherpa-onnx-vars.sh
          bash scripts/build-sherpa-onnx.sh "${SHERPA_ONNX_VERSION}" "${prefix}"
          echo "VINPUT_CMAKE_PREFIX_PATH=${prefix}" >> "${GITHUB_ENV}"

      - name: Configure CMake
        run: |
          cmake --preset release-clang-mold \
            -DVINPUT_ENABLE_WERROR=ON \
            -DVINPUT_PACKAGE_HOMEPAGE_URL="${{ github.server_url }}/${{ github.repository }}" \
            -DVINPUT_RUNTIME_MODE=bundled

      - name: Run cpp-linter (Clang-Tidy & Clang-Format)
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'
          database: 'build'
          tidy-checks: ''
          version: '18'
          lines-changed-only: false
          files-changed-only: true
          step-summary: true
          file-annotations: true
          thread-comments: 'false'
          ignore: '3rdparty|build'
          summary-output-file: 'pr-report/summary.md'

      - name: Save PR info and report
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p pr-report
          echo "${{ github.event.pull_request.number }}" > pr-report/pr_number
          echo "${{ steps.linter.outputs.clang-format-checks-failed }}" > pr-report/format_failed
          echo "${{ steps.linter.outputs.clang-tidy-checks-failed }}" > pr-report/tidy_failed

      - name: Upload artifact for PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-report
          path: pr-report/
          retention-days: 1

      - name: Fail on formatting or tidy violations
        if: steps.linter.outputs.clang-format-checks-failed > 0 || steps.linter.outputs.clang-tidy-checks-failed > 0
        run: |
          echo "cpp-linter checks failed! Please inspect clang-format and clang-tidy annotations."
          exit 1

  build:
    name: build-linux-${{ matrix.mode }}
    needs: [cpp-linter]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: full
            enable_local_asr: 'ON'
          - mode: lite
            enable_local_asr: 'OFF'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate bundled JSON
        run: |
          python3 -m json.tool data/default-config.json >/dev/null
          python3 -m json.tool notification.json >/dev/null

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh ubuntu24.04

      - name: Check i18n
        run: python3 scripts/check-i18n.py

      - name: Install sherpa-onnx build runtime
        if: matrix.enable_local_asr == 'ON'
        run: |
          prefix="${RUNNER_TEMP}/sherpa-onnx-install"
          source scripts/sherpa-onnx-vars.sh
          bash scripts/build-sherpa-onnx.sh "${SHERPA_ONNX_VERSION}" "${prefix}"
          echo "VINPUT_CMAKE_PREFIX_PATH=${prefix}" >> "${GITHUB_ENV}"

      - uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-ci-linux-${{ matrix.mode }}-${{ github.ref_name }}
          restore-keys: |
            sccache-ci-linux-${{ matrix.mode }}-

      - name: Configure
        run: |
          cmake --preset ci-clang-mold \
            -DVINPUT_ENABLE_WERROR=ON \
            -DVINPUT_ENABLE_LOCAL_ASR=${{ matrix.enable_local_asr }} \
            -DVINPUT_PACKAGE_HOMEPAGE_URL="${{ github.server_url }}/${{ github.repository }}" \
            -DVINPUT_RUNTIME_MODE=bundled

      - name: Build all targets
        run: cmake --build --preset ci-clang-mold

      - name: Run unit test suite
        run: ctest --test-dir build --output-on-failure

      - name: Verify CLI feature surface
        shell: bash
        run: |
          help_output="$(LANGUAGE=C build/src/cli/vinput --help)"
          version_output="$(build/src/cli/vinput -v)"
          if [[ "${{ matrix.enable_local_asr }}" == "ON" ]]; then
            grep -Eq '^  model[[:space:]]' <<<"${help_output}"
            grep -Eq '^  hotword[[:space:]]' <<<"${help_output}"
            if grep -q 'lite' <<<"${version_output}"; then
              echo "Full build version unexpectedly contains 'lite': ${version_output}" >&2
              exit 1
            fi
          else
            if grep -Eq '^  model[[:space:]]' <<<"${help_output}"; then
              echo "Lite build unexpectedly exposes the model command." >&2
              exit 1
            fi
            if grep -Eq '^  hotword[[:space:]]' <<<"${help_output}"; then
              echo "Lite build unexpectedly exposes the hotword command." >&2
              exit 1
            fi
            if ! grep -q -- '-lite' <<<"${version_output}"; then
              echo "Lite build version does not contain '-lite': ${version_output}" >&2
              exit 1
            fi
          fi

  build-nix-lite:
    name: build-nix-lite
    needs: [cpp-linter]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build official lite package
        run: nix build .#fcitx5-vinput-lite --no-link

      - name: Verify lite runtime closure excludes local ASR dependencies
        run: |
          if nix path-info --recursive .#fcitx5-vinput-lite | grep -Ei '(openfst|onnxruntime|sherpa-onnx|kaldi|sentencepiece)'; then
            echo "Lite runtime closure contains a local ASR dependency." >&2
            exit 1
          fi
