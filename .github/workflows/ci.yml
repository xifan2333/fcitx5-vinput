name: ci

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '3rdparty/**'
      - 'po/**'
      - 'i18n/**'
      - 'data/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'VERSION'
      - 'flake.nix'
      - 'flake.lock'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - '3rdparty/**'
      - 'po/**'
      - 'i18n/**'
      - 'data/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'VERSION'
      - 'flake.nix'
      - 'flake.lock'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G

jobs:
  cpp-linter:
    name: cpp-linter
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Restore apt archive cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vinput-apt-archives
          key: apt-archives-${{ runner.os }}-${{ hashFiles('scripts/ci-install-build-deps.sh') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh ubuntu24.04

      - name: Install LLVM 21 clang-tools
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21 clang-tidy-21

      - name: Install sherpa-onnx runtime
        run: |
          prefix="${RUNNER_TEMP}/sherpa-onnx-install"
          source scripts/sherpa-onnx-vars.sh
          bash scripts/build-sherpa-onnx.sh "${SHERPA_ONNX_VERSION}" "${prefix}"
          echo "VINPUT_CMAKE_PREFIX_PATH=${prefix}" >> "${GITHUB_ENV}"

      - name: Configure CMake
        run: |
          cmake --preset release-clang-mold \
            -DVINPUT_ENABLE_WERROR=ON \
            -DVINPUT_PACKAGE_HOMEPAGE_URL="${{ github.server_url }}/${{ github.repository }}" \
            -DVINPUT_RUNTIME_MODE=bundled

      - name: Run Clang-Format
        id: format
        run: |
          mkdir -p pr-report
          format_failed=0
          CLANG_FORMAT=$(command -v clang-format-21 || command -v clang-format)
          echo "Using clang-format: $CLANG_FORMAT ($($CLANG_FORMAT --version))"
          if ! find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -exec "$CLANG_FORMAT" --dry-run --Werror {} +; then
            format_failed=1
          fi
          echo "format_failed=${format_failed}" >> "${GITHUB_OUTPUT}"
          echo "${format_failed}" > pr-report/format_failed

      - name: Run Clang-Tidy (LLVM Parallel Runner)
        id: tidy
        run: |
          mkdir -p pr-report
          tidy_failed=0
          RUN_TIDY=$(command -v run-clang-tidy-21 || command -v run-clang-tidy)
          CLANG_TIDY=$(command -v clang-tidy-21 || command -v clang-tidy)
          echo "Using run-clang-tidy: $RUN_TIDY with binary $CLANG_TIDY"

          # Verify that matching compilation units exist in compile_commands.json
          matched_units=$(jq '[.[] | select(.file | test(".*/(src|tests)/.*"))] | length' build/compile_commands.json)
          echo "Found ${matched_units} compilation units matching .*/(src|tests)/.*"
          if [ "${matched_units}" -eq 0 ]; then
            echo "Error: 0 compilation units matched for Clang-Tidy analysis!" >> pr-report/tidy.log
            tidy_failed=1
          fi

          if ! "$RUN_TIDY" -clang-tidy-binary "$CLANG_TIDY" -p build -j $(nproc) '.*/(src|tests)/.*' > pr-report/tidy.log 2>&1; then
            tidy_failed=1
          fi
          if grep -q "warning:" pr-report/tidy.log || grep -q "error:" pr-report/tidy.log; then
            tidy_failed=1
          fi
          echo "tidy_failed=${tidy_failed}" >> "${GITHUB_OUTPUT}"
          echo "${tidy_failed}" > pr-report/tidy_failed

      - name: Generate summary report
        if: always()
        run: |
          mkdir -p pr-report
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "${{ github.event.pull_request.number }}" > pr-report/pr_number
          fi
          {
            echo "### Clang-Tidy & Clang-Format Report"
            echo ""
            format_status="unknown"
            if [ -f pr-report/format_failed ]; then
              format_status="$(cat pr-report/format_failed)"
            fi
            tidy_status="unknown"
            if [ -f pr-report/tidy_failed ]; then
              tidy_status="$(cat pr-report/tidy_failed)"
            fi

            if [ "$format_status" = "0" ]; then
              echo "- **Clang-Format**: Passed cleanly"
            elif [ "$format_status" = "unknown" ]; then
              echo "- **Clang-Format**: Not run or failed during setup"
            else
              echo "- **Clang-Format**: Formatting violations detected"
            fi

            if [ "$tidy_status" = "0" ]; then
              echo "- **Clang-Tidy**: 0 warnings"
            elif [ "$tidy_status" = "unknown" ]; then
              echo "- **Clang-Tidy**: Not run or failed during setup"
            else
              echo "- **Clang-Tidy**: Violations detected"
              echo ""
              echo '```'
              if [ -f pr-report/tidy.log ]; then
                tail -n 200 pr-report/tidy.log
              fi
              echo '```'
            fi
          } > pr-report/summary.md
          cat pr-report/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact for PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: pr-report
          path: pr-report/
          retention-days: 1

      - name: Fail on formatting or tidy violations
        if: steps.format.outputs.format_failed != '0' || steps.tidy.outputs.tidy_failed != '0'
        run: |
          echo "Linter checks failed! Please inspect clang-format and clang-tidy report."
          cat pr-report/summary.md
          exit 1

  build:
    name: build-linux-${{ matrix.mode }}
    needs: [cpp-linter]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: full
            enable_local_asr: 'ON'
          - mode: lite
            enable_local_asr: 'OFF'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Restore apt archive cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vinput-apt-archives
          key: apt-archives-${{ runner.os }}-${{ hashFiles('scripts/ci-install-build-deps.sh') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Validate bundled JSON
        run: |
          python3 -m json.tool data/default-config.json >/dev/null
          python3 -m json.tool notification.json >/dev/null

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh ubuntu24.04

      - name: Check i18n
        run: python3 scripts/check-i18n.py

      - name: Install sherpa-onnx build runtime
        if: matrix.enable_local_asr == 'ON'
        run: |
          prefix="${RUNNER_TEMP}/sherpa-onnx-install"
          source scripts/sherpa-onnx-vars.sh
          bash scripts/build-sherpa-onnx.sh "${SHERPA_ONNX_VERSION}" "${prefix}"
          echo "VINPUT_CMAKE_PREFIX_PATH=${prefix}" >> "${GITHUB_ENV}"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-ci-linux-${{ matrix.mode }}-${{ github.ref_name }}
          restore-keys: |
            sccache-ci-linux-${{ matrix.mode }}-

      - name: Configure
        run: |
          cmake --preset ci-clang-mold \
            -DVINPUT_ENABLE_WERROR=ON \
            -DVINPUT_ENABLE_LOCAL_ASR=${{ matrix.enable_local_asr }} \
            -DVINPUT_PACKAGE_HOMEPAGE_URL="${{ github.server_url }}/${{ github.repository }}" \
            -DVINPUT_RUNTIME_MODE=bundled

      - name: Build all targets
        run: cmake --build --preset ci-clang-mold

      - name: Run unit test suite
        run: ctest --test-dir build --output-on-failure --timeout 60

  build-nix-lite:
    name: build-nix-lite
    needs: [cpp-linter]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build official lite package
        run: nix build .#fcitx5-vinput-lite --no-link

      - name: Verify lite runtime closure excludes local ASR dependencies
        run: |
          if nix path-info --recursive .#fcitx5-vinput-lite | grep -Ei '(openfst|onnxruntime|sherpa-onnx|kaldi|sentencepiece)'; then
            echo "Lite runtime closure contains a local ASR dependency." >&2
            exit 1
          fi

  dead-code-check:
    name: dead-code-check
    needs: [cpp-linter]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Restore apt archive cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vinput-apt-archives
          key: apt-archives-${{ runner.os }}-${{ hashFiles('scripts/ci-install-build-deps.sh') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Install build dependencies
        run: ./scripts/ci-install-build-deps.sh ubuntu24.04

      - name: Install sherpa-onnx build runtime
        run: |
          prefix="${RUNNER_TEMP}/sherpa-onnx-install"
          source scripts/sherpa-onnx-vars.sh
          bash scripts/build-sherpa-onnx.sh "${SHERPA_ONNX_VERSION}" "${prefix}"
          echo "VINPUT_CMAKE_PREFIX_PATH=${prefix}" >> "${GITHUB_ENV}"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-ci-linux-deadcode-${{ github.ref_name }}
          restore-keys: |
            sccache-ci-linux-deadcode-

      - name: Configure non-LTO Debug build
        run: |
          cmake --preset debug-clang-mold \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DVINPUT_ENABLE_LOCAL_ASR=ON \
            -DVINPUT_RUNTIME_MODE=bundled

      - name: Build all targets
        run: cmake --build --preset debug-clang-mold

      - name: Audit cross-TU dead strong symbols
        run: python3 scripts/check-dead-code.py build
