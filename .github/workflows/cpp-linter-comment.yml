name: cpp-linter-comment

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: cpp-linter-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  post-comment:
    name: Post or update linter comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-report
          path: pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        id: download

      - name: Post or update comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumFile = path.join('pr-report', 'pr_number');
            if (!fs.existsSync(prNumFile)) {
              console.log('No pr_number file found, skipping.');
              return;
            }

            const prNumber = parseInt(fs.readFileSync(prNumFile, 'utf8').trim(), 10);
            if (isNaN(prNumber) || prNumber <= 0) {
              console.log('Invalid PR number:', prNumber);
              return;
            }

            const formatFile = path.join('pr-report', 'format_failed');
            const tidyFile = path.join('pr-report', 'tidy_failed');
            const formatRaw = fs.existsSync(formatFile) ? fs.readFileSync(formatFile, 'utf8').trim() : '';
            const tidyRaw = fs.existsSync(tidyFile) ? fs.readFileSync(tidyFile, 'utf8').trim() : '';
            const formatFailed = formatRaw === '' ? NaN : parseInt(formatRaw, 10);
            const tidyFailed = tidyRaw === '' ? NaN : parseInt(tidyRaw, 10);
            const runId = '${{ github.event.workflow_run.id }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const marker = '<!-- cpp-linter-status-comment -->';
            let body = `${marker}\n### C++ Code Quality Gate\n\n`;

            if (isNaN(formatFailed) || isNaN(tidyFailed)) {
              body += `| Tool | Scope | Status | Details |\n`;
              body += `| :--- | :--- | :--- | :--- |\n`;
              body += `| Pipeline Gate | C++ Linter | Error | Linter setup or CMake configuration failed. |\n\n`;
              body += `Please inspect the [Workflow Run Summary](${runUrl}) for build/configuration logs.`;
            } else if (formatFailed === 0 && tidyFailed === 0) {
              body += `| Tool | Scope | Issues | Status |\n`;
              body += `| :--- | :--- | :--- | :--- |\n`;
              body += `| Clang-Format | Lines changed | 0 | Passed |\n`;
              body += `| Clang-Tidy | Files changed | 0 | Passed |\n\n`;
              body += `All C++ code formatting and static analysis checks passed cleanly.\n\n`;
              body += `[View Workflow Run Summary](${runUrl})`;
            } else {
              const formatStatus = formatFailed > 0 ? 'Failed' : 'Passed';
              const tidyStatus = tidyFailed > 0 ? 'Failed' : 'Passed';

              body += `| Tool | Scope | Issues | Status |\n`;
              body += `| :--- | :--- | :--- | :--- |\n`;
              body += `| Clang-Format | Lines changed | ${formatFailed} | ${formatStatus} |\n`;
              body += `| Clang-Tidy | Files changed | ${tidyFailed} | ${tidyStatus} |\n\n`;

              const summaryFile = path.join('pr-report', 'summary.md');
              let hasSummary = false;
              if (fs.existsSync(summaryFile)) {
                let summaryText = fs.readFileSync(summaryFile, 'utf8').trim();
                if (summaryText) {
                  hasSummary = true;
                  if (summaryText.length > 55000) {
                    summaryText = summaryText.slice(0, 55000) + '\n\n... (truncated, view full summary in workflow run)';
                  }
                  body += `<details open>\n<summary>Detailed Diagnostics</summary>\n\n${summaryText}\n\n</details>\n\n`;
                }
              }

              if (!hasSummary) {
                body += `Please inspect the [Workflow Run Summary](${runUrl}) for detailed diagnostic logs.\n`;
              } else {
                body += `[View Workflow Run Summary](${runUrl})\n`;
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log(`Updated existing comment ${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              console.log(`Created new comment on PR #${prNumber}`);
            }
