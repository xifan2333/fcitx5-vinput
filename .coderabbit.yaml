# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "zh-CN"
reviews:
  profile: "chill"
  auto_review:
    drafts: false
    ignore_title_keywords:
      - "chore: release"
      - "chore: initialize draft pr"
      - "chore(release)"
  tools:
    github-checks:
      enabled: true
    shellcheck:
      enabled: true
  pre_merge_checks:
    docstrings:
      # This repo documents C++ with self-explanatory names and // comments, never
      # docstrings, so a coverage threshold can only ever report 0%.
      mode: "off"
chat:
  auto_reply: true
