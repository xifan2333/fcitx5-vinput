id: prefer-switch-for-enum
message: "检测到限定名常量的级联比较。若比较对象是枚举，请改用 switch-case 并通过省略 default 借助 -Wswitch 检查穷尽性；若为字符串常量，建议采用表驱动（Table-driven）扁平化。"
severity: warning
language: Cpp
files:
  - "src/**"
rule:
  any:
    - pattern:
        context: |
          if ($X == $A::$B) {
            $$$BODY1
          } else if ($X == $A::$C) {
            $$$BODY2
          } else if ($X == $A::$D) {
            $$$BODY3
          }
        strictness: smart
    - pattern:
        context: |
          if ($X == $A::$B) {
            $$$BODY1
          } else if ($X == $A::$C) {
            $$$BODY2
          } else if ($X == $A::$D) {
            $$$BODY3
          } else {
            $$$ELSE
          }
        strictness: smart
constraints:
  X:
    not:
      has:
        kind: call_expression
