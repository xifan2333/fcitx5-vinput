id: anti-daemon-stdout
message: "严禁在守护进程或输入法插件中使用裸标准输出 (std::cout/cerr, printf, puts, fprintf/fputs)。请统一使用 VLOG_* 结构化分级日志。"
severity: error
language: Cpp
files:
  - "src/daemon/**"
  - "src/addon/**"
utils:
  std_qualified_stream:
    any:
      - kind: qualified_identifier
        all:
          - has:
              field: scope
              kind: namespace_identifier
              regex: "^std$"
          - has:
              field: name
              kind: identifier
              regex: "^(cout|cerr)$"
      - kind: qualified_identifier
        all:
          - not:
              has:
                field: scope
                regex: ".*"
          - has:
              field: name
              kind: qualified_identifier
              all:
                - has:
                    field: scope
                    kind: namespace_identifier
                    regex: "^std$"
                - has:
                    field: name
                    kind: identifier
                    regex: "^(cout|cerr)$"
  std_or_global_stdio_fn:
    any:
      - kind: identifier
        regex: "^(printf|puts|fprintf|fputs)$"
      - kind: qualified_identifier
        all:
          - not:
              has:
                field: scope
                regex: ".*"
          - has:
              field: name
              any:
                - kind: identifier
                  regex: "^(printf|puts|fprintf|fputs)$"
                - kind: qualified_identifier
                  all:
                    - has:
                        field: scope
                        kind: namespace_identifier
                        regex: "^std$"
                    - has:
                        field: name
                        kind: identifier
                        regex: "^(printf|puts|fprintf|fputs)$"
      - kind: qualified_identifier
        all:
          - has:
              field: scope
              kind: namespace_identifier
              regex: "^std$"
          - has:
              field: name
              kind: identifier
              regex: "^(printf|puts|fprintf|fputs)$"
rule:
  any:
    - all:
        - kind: binary_expression
        - pattern: $L << $R
        - has:
            field: left
            matches: std_qualified_stream
    - all:
        - kind: call_expression
        - has:
            field: function
            matches: std_or_global_stdio_fn
