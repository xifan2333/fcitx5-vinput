id: anti-raw-subprocess
message: "严禁在守护进程或命令行中使用裸 system()/popen()。外部子进程请统一使用 src/common/utils/process_utils.h (vinput::process::Run)。"
severity: error
language: Cpp
files:
  - "src/daemon/**"
  - "src/cli/**"
utils:
  std_or_global_subproc_fn:
    any:
      - kind: identifier
        regex: "^(system|popen)$"
      - kind: qualified_identifier
        all:
          - not:
              has:
                field: scope
                regex: ".*"
          - has:
              field: name
              any:
                - kind: identifier
                  regex: "^(system|popen)$"
                - kind: qualified_identifier
                  all:
                    - has:
                        field: scope
                        kind: namespace_identifier
                        regex: "^std$"
                    - has:
                        field: name
                        kind: identifier
                        regex: "^(system|popen)$"
      - kind: qualified_identifier
        all:
          - has:
              field: scope
              kind: namespace_identifier
              regex: "^std$"
          - has:
              field: name
              kind: identifier
              regex: "^(system|popen)$"
rule:
  kind: call_expression
  has:
    field: function
    matches: std_or_global_subproc_fn
