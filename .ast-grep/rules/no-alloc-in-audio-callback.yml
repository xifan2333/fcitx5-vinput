id: no-alloc-in-audio-callback
message: "实时音频回调线程中绝对禁止堆内存分配与互斥锁加锁！必须使用预分配内存与无锁队列 (readerwriterqueue)。"
severity: error
language: C++
files:
  - "src/daemon/audio/audio_capture.cpp"
rule:
  inside:
    pattern: "void AudioCapture::processCallback() { $$$BODY }"
  any:
    - pattern: new $T($$$ARGS)
    - pattern: new $T[$$$N]
    - pattern: malloc($$$ARGS)
    - pattern: std::make_unique<$$$T>($$$ARGS)
    - pattern: std::make_shared<$$$T>($$$ARGS)
    - pattern: $MUTEX.lock()
