id: signal-handler-no-lambda
message: "严禁向 std::signal / signal 传递 lambda 表达式。忽略信号请使用标准宏 SIG_IGN，恢复默认请使用 SIG_DFL，自定义处理请使用独立命名函数。"
severity: error
language: Cpp
files:
  - "src/**"
utils:
  std_or_global_signal_fn:
    any:
      - kind: identifier
        regex: "^signal$"
      - kind: qualified_identifier
        all:
          - not:
              has:
                field: scope
                regex: ".*"
          - has:
              field: name
              any:
                - kind: identifier
                  regex: "^signal$"
                - kind: qualified_identifier
                  all:
                    - has:
                        field: scope
                        kind: namespace_identifier
                        regex: "^std$"
                    - has:
                        field: name
                        kind: identifier
                        regex: "^signal$"
      - kind: qualified_identifier
        all:
          - has:
              field: scope
              kind: namespace_identifier
              regex: "^std$"
          - has:
              field: name
              kind: identifier
              regex: "^signal$"
rule:
  kind: call_expression
  all:
    - has:
        field: function
        matches: std_or_global_signal_fn
    - has:
        field: arguments
        pattern:
          context: "f($SIG, $HANDLER)"
          selector: argument_list
constraints:
  HANDLER:
    kind: lambda_expression
