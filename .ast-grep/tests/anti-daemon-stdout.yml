id: anti-daemon-stdout
valid:
  - "myns::cout << \"ok\";"
  - "::myns::cerr << \"ok\";"
  - "myns::printf(\"ok\");"
  - "::myns::printf(\"ok\");"
  - "std::myns::printf(\"ok\");"
  - "o.printf(\"ok\");"
  - "std::snprintf(buf, sizeof(buf), \"%d\", 1);"
invalid:
  - "std::cout << \"1\";"
  - "::std::cout << \"2\";"
  - "std :: cerr << \"3\";"
  - ":: std :: cerr << \"4\";"
  - "std::cout << \"a\" << \"b\";"
  - "printf(\"1\");"
  - "std::printf(\"2\");"
  - "::std::printf(\"3\");"
  - "::printf(\"4\");"
  - "std :: printf(\"5\");"
  - ":: std :: printf(\"6\");"
  - "std :: fprintf(stderr, \"7\");"
  - "::std::puts(\"8\");"
  - "std :: fputs(\"9\", stderr);"
