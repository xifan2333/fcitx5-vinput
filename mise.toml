[tools]
hk = "2"
node = "latest"
pandoc = "latest"
ruff = "latest"
shfmt = "latest"
"npm:jscpd" = "5"
"npm:prettier" = "3"
# Pinned to CI's cpp-linter major version (clang-tidy 21, ubuntu-24.04).
# Do not upgrade past 21.x without checking .github/workflows/ci.yml first.
"pipx:clang-tidy" = "21.1.6"

[env]
_.file = ".env"

[tasks.default]
description = "List available tasks"
run = "mise tasks"

[tasks.hooks-install]
description = "Install hk git hooks with mise integration"
run = "hk install --mise"

[tasks.check]
description = "Run all hk checks across the repo"
run = "hk run check"

[tasks."check:plan"]
description = "Preview hk check execution plan without running tools"
run = "hk run check --plan"

[tasks."check:changed"]
description = "Run hk check only on modified/staged/untracked files"
run = """
#!/usr/bin/env bash
set -euo pipefail
{
  git diff --name-only -z
  git diff --cached --name-only -z
  git ls-files --others --exclude-standard -z
} | hk run check --files0-from - "$@"
"""

[tasks."check:dup"]
description = "Analyze code duplication across src/ using jscpd"
run = "jscpd src --reporters console"

[tasks."check:tidy"]
description = "Run clang-tidy on C++ files (default: changed vs origin/main; --all; --full for VINPUT_ENABLE_LOCAL_ASR paths)"
run = "bash scripts/check-tidy.sh \"$@\""

[tasks.fix]
description = "Run all hk fixers to format files"
run = "hk fix"

[tasks."check-i18n"]
description = "Validate gettext and Qt translation files"
run = "python3 scripts/check-i18n.py"

[tasks.configure]
description = "Configure CMake build directory (Release by default, or: mise run configure Debug /usr)"
run = """
#!/usr/bin/env bash
set -euo pipefail
type="${1:-Release}"
prefix="${2:-/usr}"
shift 2 2>/dev/null || shift 1 2>/dev/null || true
if [ "$type" = "Debug" ]; then
  cmake --preset debug-clang-mold -DCMAKE_INSTALL_PREFIX="$prefix" "$@"
else
  cmake --preset release-clang-mold -DCMAKE_INSTALL_PREFIX="$prefix" "$@"
fi
"""

[tasks.build]
description = "Build project with CMake (Release preset)"
run = "cmake --build --preset release-clang-mold"

[tasks.build-debug]
description = "Build project with CMake (Debug preset)"
run = "cmake --build --preset debug-clang-mold"

[tasks.clean]
description = "Remove CMake build directory"
run = "rm -rf build"

[tasks.install]
description = "Install built binaries, systemd units and man pages"
run = """
#!/usr/bin/env bash
set -euo pipefail
prefix="${1:-/usr}"
cmake --preset release-clang-mold -DCMAKE_INSTALL_PREFIX="$prefix"
cmake --install build
echo "note: run 'systemctl --user daemon-reload' after installing systemd user units"
if [ "$prefix" = "/usr" ]; then
  echo "== Stale /usr/local Paths =="
  for p in /usr/local/bin/vinput /usr/local/bin/vinput-daemon /usr/local/bin/vinput-gui \
           /usr/local/share/systemd/user/vinput-daemon.service \
           /usr/local/share/dbus-1/services/org.fcitx.Vinput.service \
           /usr/local/share/applications/vinput-gui.desktop; do
    if [ -e "$p" ]; then
      ls -ld "$p"
    fi
  done
fi
"""

[tasks.sherpa]
description = "Build and package bundled sherpa-onnx runtime"
run = """
#!/usr/bin/env bash
set -euo pipefail
bash scripts/build-sherpa-onnx.sh "${1:-}" "${2:-/usr}" "${3:-}"
"""

[tasks.release]
description = "Create and push a git release tag (e.g.: mise run release 0.8.0 main)"
run = """
#!/usr/bin/env bash
set -euo pipefail
version_value="${1:-}"
ref="${2:-main}"
if [ -z "${version_value}" ]; then
  version_value="$(tr -d '\n' < VERSION)"
fi
version_value="${version_value#v}"
git tag "v${version_value}" "${ref}"
git push origin "v${version_value}"
"""

[tasks.channels]
description = "Trigger GitHub Actions packaging channels workflow"
run = """
#!/usr/bin/env bash
set -euo pipefail
ref="${1:-main}"
version_value="${2:-}"
ppa_revision_value="${3:-}"
if [ -z "${version_value}" ]; then
  version_value="$(tr -d '\n' < VERSION)"
fi
extra_fields=()
if [ -n "${ppa_revision_value}" ]; then
  extra_fields+=(--field ppa_revision="${ppa_revision_value}")
fi
gh workflow run channels.yml \
  --ref main \
  --field ref="${ref}" \
  --field version="${version_value}" \
  "${extra_fields[@]}"
"""

[tasks.docs-dev]
description = "Start Astro documentation site in development mode"
dir = "site"
run = "npm run dev"

[tasks.docs-build]
description = "Build Astro documentation site"
dir = "site"
run = "npm run build"
